services:
  - type: web
    name: godrej-blue-kolkata
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DB_NAME
        value: godrej_blue
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: godrej@2026
      - key: MONGODB_URI
        sync: false
